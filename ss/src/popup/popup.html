<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnapCapture</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <h1>SnapCapture</h1>
    </header>

    <main id="home-view">
      <button id="capture-visible" class="primary">Capture Visible Area</button>
      <button id="capture-full-page">Capture Full Page</button>
      <button id="capture-area">Select Area</button>
      <div class="delay-row">
        <select id="delay-select" aria-label="Delay before capture">
          <option value="3">3s</option>
          <option value="5" selected>5s</option>
          <option value="10">10s</option>
        </select>
        <button id="capture-delayed">Delayed Capture</button>
      </div>
      <hr class="divider" />
      <button id="record-screen">Record Screen</button>
      <p id="home-status" class="status" role="status" aria-live="polite"></p>
      <p class="hint">Free, forever. No account needed.</p>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
