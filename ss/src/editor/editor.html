<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnapCapture — Screenshot</title>
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <h1>SnapCapture</h1>
    </header>

    <div id="toolbar">
      <div class="tool-group" role="group" aria-label="Annotation tools">
        <button class="tool-btn active" data-tool="arrow" aria-pressed="true">➚ Arrow</button>
        <button class="tool-btn" data-tool="rectangle" aria-pressed="false">▭ Box</button>
        <button class="tool-btn" data-tool="ellipse" aria-pressed="false">◯ Ellipse</button>
        <button class="tool-btn" data-tool="highlight" aria-pressed="false">▮ Highlight</button>
        <button class="tool-btn" data-tool="blur" aria-pressed="false">▦ Blur</button>
        <button class="tool-btn" data-tool="text" aria-pressed="false">T Text</button>
        <button class="tool-btn" data-tool="crop" aria-pressed="false">⛶ Crop</button>
      </div>

      <div class="color-group" role="group" aria-label="Annotation colour"></div>

      <div class="tool-group">
        <button id="undo-btn" disabled>Undo</button>
        <button id="redo-btn" disabled>Redo</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>

    <main>
      <div class="canvas-wrap">
        <canvas id="canvas" aria-label="Screenshot being annotated" role="img"></canvas>
      </div>
      <div class="toolbar bottom-toolbar">
        <select id="format-select" aria-label="Export format" disabled>
          <option value="png" selected>PNG</option>
          <option value="jpg">JPG</option>
          <option value="pdf">PDF</option>
        </select>
        <button id="download-btn" class="primary">Download</button>
        <button id="copy-btn">Copy to Clipboard</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./editor.ts"></script>
  </body>
</html>
