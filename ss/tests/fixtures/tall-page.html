<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnapCapture test fixture</title>
    <style>
      body {
        margin: 0;
        font:
          16px system-ui,
          sans-serif;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: #0f172a;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 16px;
      }
      section {
        height: 900px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        color: #fff;
      }
      .a {
        background: #ef4444;
      }
      .b {
        background: #2563eb;
      }
      .c {
        background: #22c55e;
      }
      .d {
        background: #facc15;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <!-- A fixed header, so full-page capture has something to hide after the
         first slice; four tall sections, so the page needs several slices. -->
    <header>Fixed header that must not repeat down the stitched image</header>
    <section class="a">1</section>
    <section class="b">2</section>
    <section class="c">3</section>
    <section class="d">4</section>
  </body>
</html>
