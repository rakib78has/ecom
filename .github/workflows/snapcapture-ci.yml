name: SnapCapture CI

# This repository holds several projects side by side, and GitHub only reads
# workflows from the repository root, so this one lives here and scopes every
# step to ss/ via `working-directory` and the path filters below.
on:
  push:
    branches: [main]
    paths: ['ss/**', '.github/workflows/snapcapture-ci.yml']
  pull_request:
    paths: ['ss/**', '.github/workflows/snapcapture-ci.yml']
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: ss

concurrency:
  group: snapcapture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ss/.nvmrc
          cache: npm
          cache-dependency-path: ss/package-lock.json

      # `npm ci` installs exactly the lockfile, so a build is reproducible and
      # a tampered lockfile fails rather than silently resolving something new.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ss/coverage/
          retention-days: 14

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ss/.nvmrc
          cache: npm
          cache-dependency-path: ss/package-lock.json

      - run: npm ci

      - name: Build extension
        run: npm run build

      # A successful build does not prove the manifest is loadable or that the
      # paths it names were emitted. That is a separate gate.
      - name: Validate manifest and artifacts
        run: npm run validate:manifest

      - name: Package for the Chrome Web Store
        run: npm run package

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: snapcapture-extension
          path: ss/snapcapture-*.zip
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: End-to-end (real Chromium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ss/.nvmrc
          cache: npm
          cache-dependency-path: ss/package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # E2E runs against the built artifact, not the sources.
      - name: Build extension
        run: npm run build

      # An MV3 service worker only starts under the new headless mode; the old
      # one loads no extensions at all, which looks like a test bug instead of
      # a configuration one. xvfb keeps that reliable on a headless runner.
      - name: Run end-to-end tests
        run: xvfb-run --auto-servernum npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ss/playwright-report/
          retention-days: 14

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: ss/.nvmrc
          cache: npm
          cache-dependency-path: ss/package-lock.json

      - run: npm ci

      # The extension ships no runtime dependencies, so anything reported here
      # is in the build toolchain. High and critical still block the merge.
      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Report all advisories
        if: always()
        run: npm audit || true
